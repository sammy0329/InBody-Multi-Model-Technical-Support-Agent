[project]
name = "inbody-tech-master"
version = "0.1.0"
description = "InBody 기종 식별 기반 멀티 에이전트 기술 지원 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]
prod = [
    "pinecone-client>=3.0.0",
    "psycopg2-binary>=2.9.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Deterministic unit tests (no LLM, no API key)",
    "contract: API contract tests",
    "evaluation: SC metrics evaluation tests",
    "sc001: SC-001 model identification accuracy",
    "sc003: SC-003 error code resolution accuracy",
    "sc004: SC-004 medical disclaimer inclusion",
    "sc005: SC-005 cross-model information isolation",
    "sc006: SC-006 Level 3 safety enforcement",
    "sc009: SC-009 hallucination prevention",
    "sc010: SC-010 semantic cache hit rate",
    "sc011: SC-011 cache response latency",
    "sc012: SC-012 cache cross-contamination isolation",
]

[tool.ruff]
target-version = "py311"
line-length = 100
